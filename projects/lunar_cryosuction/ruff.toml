# ruff: Python linter for preprocess/, postprocess/ and scripts/.
# Check only; ruff format is not used, so existing code layout is untouched.
#   venv_cryosuction/bin/ruff check .            # whole project
#   venv_cryosuction/bin/ruff check <file>       # one file
# Pinned in requirements.txt.

target-version = "py311"   # HPC caps Python at 3.11
line-length = 120

extend-exclude = [
    "venv_*",
    "scratch",
    "*/scratch",
    "studies/*/campaign_*",
    "preprocess/igakit_complexgeocodes",  # legacy igakit mesh scripts; not linted
]

[lint]
# Ruff's defaults (pyflakes F; pycodestyle E4, E7, E9): undefined names,
# unused imports and variables, syntax errors. B (bugbear) catches common
# logic slips such as mutable default arguments.
select = ["E4", "E7", "E9", "F", "B"]
# Style-only rules that fire often in working code here are switched off, so
# what remains is mostly unused code and possible logic slips.
ignore = [
    "E741",  # ambiguous names such as l and I are normal in this physics code
    "E702",  # several statements on one line with semicolons
    "E731",  # lambda assigned to a name
    "E402",  # import after sys.path setup (preprocess/comp_eps.py and others)
    "B905",  # zip() without strict=
]
