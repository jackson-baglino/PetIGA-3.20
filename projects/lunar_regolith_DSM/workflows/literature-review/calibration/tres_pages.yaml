# T-res pages (WORKFLOW.md §12): equation-dense pages whose equations and key numbers are
# known exactly, to measure reading from full pages against reading from 300 dpi tiles.
#
# Moure & Fu 2024: pick 2 or 3 equation-dense pages of the arXiv v1 PDF (2407.21213v1) and
#   give their PDF page numbers. A script fills the items from the authors' LaTeX source;
#   you only spot-check them.
# Kaempfer & Plapp 2009: pick 1 or 2 equation-dense journal pages and transcribe every
#   displayed equation and every number with a unit on them, exactly as printed.
#
# page_pdf: page index in the PDF file (1 = first page), not the printed number.
# latex:    as printed, in LaTeX; single quotes around it, an apostrophe written as ''.
# label:    the equation number, or where a number sits ("text, right column, line 4").
#
# Example:
#   - label: Eq. (5)
#     latex: '\partial_t \phi = ...'
#   - label: text, right column
#     latex: '2.178 \times 10^{-5}\,\mathrm{m^2\,s^{-1}}'

pages:
  - paper: moure_fu_2024_arxiv_v1   # the arXiv v1 PDF (48 pages), not the journal PDF
    page_pdf: [8, 14, 19]     # 2 or 3 page numbers, e.g. [4, 5, 9]
    source: latex
    items: []        # filled by script from the arXiv source
  - paper: kaempfer_plapp_2009
    page_pdf: 7
    source: user
    items:
      - label: (27)
        latex: $\displaystyle \kappa(\phi)=\kappa_i\frac{1+\phi}{2}+\kappa_a\frac{1-\phi}{2}$
      - label: (28)
        latex: $\displaystyle C(\phi)=C_i\frac{1+\phi}{2}+C_a\frac{1-\phi}{2}$
      - label: (29)
        latex: $\displaystyle D(\phi)=D_v\frac{1-\phi}{2}$
      - label: (30)
        latex: $\displaystyle \rho(\phi)=\rho_i\frac{1+\phi}{2}+\rho_v\frac{1-\phi}{2}$
      - label: (31)
        latex: $\displaystyle \rho_{\mathrm{eq}}(\phi,T)=\rho_i\frac{1+\phi}{2}+\rho_{vs}(T)\frac{1-\phi}{2}$
      - label: (32)
        latex: $\displaystyle u=\frac{\rho(\phi)-\rho_{\mathrm{eq}}(\phi,T_0)}{\rho_i}$
      - label: (33)
        latex: $\displaystyle \tau\frac{\partial\phi}{\partial t}=W^2\nabla^2\phi+(\phi-\phi^3)+\lambda[u-u_{\mathrm{eq}}(T)](1-\phi^2)^2$
      - label: (34)
        latex: $\displaystyle C(\phi)\frac{\partial T}{\partial t}=\nabla[\kappa(\phi)\nabla T]+\frac{L_{sg}}{2}\frac{\partial\phi}{\partial t}$
      - label: (35)
        latex: $\displaystyle \frac{\partial u}{\partial t}=\nabla[D(\phi)\nabla u]-\frac{1}{2}\frac{\partial\phi}{\partial t}$
      - label: (36)
        latex: $\displaystyle C(\phi)\frac{\partial T}{\partial t}=\nabla[\kappa(\phi)\nabla T]+L_{sg}\left(\nabla(D(\phi)\nabla u)-\frac{\partial u}{\partial t}\right)$
      - label:
        latex:
