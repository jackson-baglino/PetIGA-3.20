# Gold statements: facts any good reading of the paper must record (WORKFLOW.md §5,
# C0 branch part). They also serve as search-test questions (T-ret, tret_questions.yaml).
# Write in your own words, one fact per statement, with the details that would make it
# wrong if they changed: number and unit, symbol, conditions, and whether the result is
# the paper's own or cited from another paper. No copied sentences.
#
# Fields
#   paper:     the paper's id from papers.yaml (already filled in each slot)
#   page:      the page number PRINTED on the page. If the fact spans pages, a list with
#              the main page first: [5, 6] for a derivation over two pages; [12, 5] for a
#              fact on p. 12 whose condition is on p. 5 (put the condition in the statement).
#   location:  table, figure, equation or section if there is one ("Table I", "Eq. 12")
#   kind:      method | equation | result | assumption | limitation | parameter
#   statement: the fact, in your words. LaTeX in $...$ is fine. If the text contains a colon
#              followed by a space, wrap the whole statement in single quotes ('...'),
#              and write an apostrophe inside it as two ('').
#   symbol, value, unit: only for a value (kind parameter, or a numerical result). A script
#              matches these exactly; units are compared by dimension (J/(m^3 K) = J m^-3 K^-1).
#              Leave them empty otherwise.
# Prose statements are matched to the readers' claims by an Opus judge; you review every
# statement it marks as missed and a sample of those it marks as found.
# Leave a slot you do not need empty, or delete it. Add slots by copying one.
#
# Example (value, unit and page from the verified units table, memory/semantic/units.md):
# - paper: kaempfer_plapp_2009
#   page: 4
#   location: Table I
#   kind: parameter
#   statement: Table I gives the heat capacity per volume of ice.
#   symbol: C_i
#   value: 1.8e6
#   unit: J m^-3 K^-1

